[package]
name = "ntag-tool"
description = "Simulates NXP NTAG 424 DNA SUN taps and verifies them (AES-128 SDM), as the off-chain verifier for the Soroban card contract"
edition.workspace = true
license.workspace = true
version.workspace = true
publish = false

[dependencies]
aes = "0.8"
cmac = "0.7"
sha2 = { workspace = true }
rand_core = { version = "0.6", features = ["getrandom"] }
hex = "0.4"
