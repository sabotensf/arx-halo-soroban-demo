[workspace]
resolver = "2"
members = ["contracts/recordpool-card", "tools/chip-sim"]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
soroban-sdk = "28.0.0"
stellar-access = "0.8.0"
stellar-macros = "0.8.0"
stellar-tokens = "0.8.0"
p256 = { version = "0.13.2", features = ["ecdsa"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
